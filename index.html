<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>

  #gate p { color: #9aa5b1; font-size: 14px; }
  #gate input {
    padding: 12px 18px; border-radius: 10px; border: 1px solid #3a4a6b;
    background: #1f2a44; color: #fff; font-size: 16px; width: 200px;
    text-align: center; letter-spacing: 4px; outline: none;
  }
  #gate button {
    padding: 12px 36px; border-radius: 10px; border: none; cursor: pointer;
    background: #e94560; color: #fff; font-size: 16px; font-weight: 600;
  }
  #gate button:active { transform: scale(0.97); }
  .err { color: #e94560; font-size: 13px; min-height: 18px; }

  /* 封面 */
  .cover { text-align: center; padding: 60px 10px 40px; }
  .cover h1 { font-size: 28px; margin-bottom: 10px; letter-spacing: 2px; }
  .cover h2 { font-size: 18px; color: #c9d1d9; font-weight: 400; margin-bottom: 24px; }
  .cover .sub { color: #9aa5b1; font-size: 15px; line-height: 1.8; margin-bottom: 36px; }
  .cover .meta { color: #7b8794; font-size: 13px; margin-bottom: 40px; letter-spacing: 1px; }
  .btn {
    display: inline-block; padding: 14px 44px; border-radius: 30px;
    background: linear-gradient(135deg, #e94560, #c23152); color: #fff;
    font-size: 17px; font-weight: 600; border: none; cursor: pointer;
    letter-spacing: 2px; box-shadow: 0 8px 24px rgba(233,69,96,0.35);
  }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: transparent; border: 1px solid #3a4a6b; color: #c9d1d9;
    box-shadow: none; padding: 12px 36px; font-size: 15px;
  }

  /* 答题 */
  #quiz { display: none; padding-top: 10px; }
  .progress-wrap {
    position: sticky; top: 0; z-index: 10;
    background: rgba(26,26,46,0.95); backdrop-filter: blur(6px);
    padding: 14px 0 10px; margin-bottom: 8px;
  }
  .progress-bar { height: 6px; background: #2a3655; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #e94560, #ff8a9b); transition: width .3s; }
  .progress-text { text-align: right; font-size: 12px; color: #7b8794; margin-top: 6px; }

  .question {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 22px 20px; margin-bottom: 20px;
  }
  .q-title { font-size: 17px; line-height: 1.6; margin-bottom: 18px; font-weight: 600; }
  .q-hint { font-size: 12px; color: #e94560; margin-bottom: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 13px 16px; border-radius: 12px; border: 1px solid #2a3655;

<body>

<!-- 密码门 -->

<script>
/* ============ 密码 ============ */
const PASSWORD = "0802";
function checkPwd() {
  const v = document.getElementById("pwd").value.trim();

    document.getElementById("gate").style.display = "none";
  } else {
    document.getElementById("err").textContent = "密码错误，请重试";
    document.getElementById("pwd").value = "";

}
document.getElementById("pwd").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPwd();
});

/* ============ 题库 ============

*/
const questions = [

/* ============ 状态 ============ */
let answers = new Array(questions.length).fill(null);

/* ============ 渲染题目 ============ */
function renderQuestions() {
  const box = document.getElementById("questions");
  box.innerHTML = "";
  questions.forEach((q, qi) => {
    const div = document.createElement("div");
    div.className = "question";
    div.id = "q" + qi;

    const hint = q.type === "multi"
      ? '<div class="q-hint">可多选</div>' : "";
    div.innerHTML = `<div class="q-title">${qi + 1}. ${q.q}</div>${hint}`;

    q.options.forEach((opt, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = q.type === "multi" ? "checkbox" : "radio";
      input.name = "q" + qi;
      input.value = oi;

      input.addEventListener("change", () => {
        if (q.type === "multi") {
          const checked = [...div.querySelectorAll("input:checked")].map(i => +i.value);
          answers[qi] = checked.length ? checked : null;
          div.querySelectorAll(".option").forEach(l => {
            l.classList.toggle("selected", l.querySelector("input").checked);
          });
        } else {
          answers[qi] = oi;
          div.querySelectorAll(".option").forEach(l => l.classList.remove("selected"));
          label.classList.add("selected");
        }
        updateProgress();
      });

      label.appendChild(input);
      label.appendChild(document.createTextNode(" " + opt.text));
      div.appendChild(label);
    });

    box.appendChild(div);
  });
  updateProgress();
}

/* ============ 进度 ============ */
function updateProgress() {
  const done = answers.filter(a => a !== null).length;
  document.getElementById("cur").textContent = done;
  document.getElementById("fill").style.width = (done / questions.length * 100) + "%";
}

/* ============ 开始 / 提交 ============ */
function startQuiz() {
  document.getElementById("cover").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  renderQuestions();
  window.scrollTo(0, 0);
}

function submitQuiz() {
  const missing = answers.findIndex(a => a === null);
  if (missing !== -1) {
    alert("还有第 " + (missing + 1) + " 题没有作答哦～");
    document.getElementById("q" + missing).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  showResult();
}

/* ============ 计分 ============ */
function calcScore() {
  let total = 0;
  let max = 0;
  questions.forEach((q, qi) => {
    if (q.type === "multi") {
      // 多选：累加所选分数，但封顶为该题最高单项分 + 1，避免多选无限拉高
      const picked = answers[qi].map(i => q.options[i].score);
      const sum = picked.reduce((a, b) => a + b, 0);
      const cap = Math.max(...q.options.map(o => o.score)) + 1;
      total += Math.min(sum, cap);
      max += cap;
    } else {
      total += q.options[answers[qi]].score;
      max += Math.max(...q.options.map(o => o.score));
    }
  });
  return Math.round(total / max * 100);
}

/* ============ 结果展示 ============ */
function showResult() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  window.scrollTo(0, 0);

  const score = calcScore();
  const ring = document.getElementById("ring");
  const num = document.getElementById("scoreNum");
  const title = document.getElementById("resTitle");
  const desc = document.getElementById("resDesc");

  // 分数动画
  let cur = 0;
  const timer = setInterval(() => {
    cur += Math.ceil(score / 30) || 1;
    if (cur >= score) { cur = score; clearInterval(timer); }
    num.textContent = cur;
  }, 30);

  // 颜色随分数变化
  const hue = 200 - score * 1.2; // 高分偏红
  ring.style.background = `conic-gradient(hsl(${hue},70%,55%) ${score * 3.6}deg, #2a3655 0deg)`;
  ring.style.boxShadow = `0 0 40px hsla(${hue},70%,55%,0.35)`;

  let t, d;
  if (score <= 25) {
    t = "☀️ 低阴湿度 · 松弛型恋人";
    d = "你在关系里相对松弛，能给对方空间，也能照顾自己的情绪。你不是不在乎，而是知道“在意”不等于“抓紧”。偶尔也会不安，但你更愿意用沟通而不是脑补来解决问题。保持这份清醒，也记得偶尔让对方知道你需要他。";
  } else if (score <= 50) {
    t = "⛅ 中等阴湿度 · 敏感但可控";
    d = "你会在意细节，也会偶尔想多，但大多时候能把自己拉回来。你重视关系的安全感，也愿意为对方调整。需要注意的是：别把“我没事”当成习惯，有些在意说出来，比憋在心里更让人靠近你。";
  } else if (score <= 75) {
    t = "🌧️ 偏高阴湿度 · 内耗型深情";
    d = "你很容易被细节牵动情绪，习惯在心里反复复盘，却不太愿意直接表达。你不是不信任对方，而是太害怕失去。试着把“他是不是没那么喜欢我”换成“我现在需要什么”，把脑补的时间用来沟通，会轻松很多。";
  } else {
    t = "⛈️ 高阴湿度 · 暴雨型心动";
    d = "你的情绪浓度很高，一点风吹草动都能在心里掀起暴雨。你深情、投入，但也容易把自己困在想象出来的剧情里。请记得：关系不是考试，不需要你提前预演所有坏结果。先照顾好自己的情绪，再去爱别人，你会更有底气。";
  }
  title.textContent = t;
  desc.textContent = d;
}

/* ============ 分享 ============ */
function shareResult() {
  const score = calcScore();
  const text = `我的恋爱阴湿度是 ${score}%，你呢？来测测你的心动背后藏着什么～`;
  if (navigator.share) {
    navigator.share({ title: "恋爱阴湿度测试", text, url: location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text + " " + location.href).then(() => {
      alert("结果已复制，去分享吧～");
    }).catch(() => {
      prompt("复制这段分享：", text + " " + location.href);
    });
  }
}

function restart() {
  answers = new Array(questions.length).fill(null);
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "none";
  document.getElementById("cover").style.display = "block";
  document.getElementById("scoreNum").textContent = "0";
  window.scrollTo(0, 0);
}
</script>
